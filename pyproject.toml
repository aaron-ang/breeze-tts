[project]
name = "breeze-tts"
version = "0.1.0"
description = "Breeze TTS 2 PyTorch inference and streaming API server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers==4.57.3",
    "qwen-tts==0.1.1",
    "huggingface-hub>=0.34",
    "numpy>=2.0",
    "soundfile>=0.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
]

[project.urls]
Upstream = "https://github.com/breezeblue-ai/breeze-tts"
Weights = "https://huggingface.co/BreezeBlue/breeze-tts-2"

[project.scripts]
breeze-tts-server = "breeze_infer.api:main"
breeze-infer-api = "breeze_infer.api:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `configs` ships too: breeze_infer.api resolves configs/fast.json relative to
# its parent directory, so it must sit next to the packages in site-packages.
packages = ["breeze_infer", "models", "configs"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_api.py imports the top-level infer.py CLI module.
pythonpath = ["."]
